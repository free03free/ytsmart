plugins {
    id 'com.android.application'
}
android {
    androidResources {
        noCompress 'zip'
    }
    namespace 'com.example.l2sbuilder'
    compileSdk 36
    defaultConfig {
        applicationId "com.example.l2sbuilder"
        minSdk 24
        targetSdk 28
        versionCode 1
        versionName "0.1"
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
}
